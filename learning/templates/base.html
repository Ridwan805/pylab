
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PyLab{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'learning/style.css' %}">
</head>

<body>
    <header class="navbar">
        <a href="/" class="brand">PyLab<span>.</span></a>

       <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'home' %}#courses">Courses</a>
            <a href="{% url 'home' %}#how-it-works">How It Works</a>

            {% if user.is_authenticated %}

                <a href="{% url 'student_dashboard' %}">
                    Dashboard
                </a>

                {% if perms.learning.view_lesson %}
                    <a href="{% url 'manage_lessons' %}">
                        Manage Lessons
                    </a>
                {% endif %}

                <span class="username">{{ user.username }}</span>

                <form method="post"
                    action="{% url 'logout' %}"
                    class="logout-form">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline">
                        Logout
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}"
                class="btn btn-primary">
                    Get Started
                </a>

            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
